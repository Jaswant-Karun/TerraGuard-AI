line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "E501",   # Line length handled by formatter
    "B008",   # Allow FastAPI Depends() in default arguments
    "B904",   # Allow raising custom AppException in token checks
    "BLE001", # Allow handling database/network exceptions
    "RUF012", # Allow class-level test/fallback containers
    "UP042",  # Allow (str, Enum) for Pydantic v2 serialization compatibility
]
