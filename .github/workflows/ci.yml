name: TerraGuard AI CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Test Suite & Security Validation
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' || mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements-prod.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint with Ruff
        run: |
          ruff check apps/backend

      - name: Run Backend Pytest Suite
        run: |
          pytest apps/backend/tests -v
        env:
          ENVIRONMENT: test
          MONGODB_URI: mongodb://localhost:27017/terraguard_test
          DATABASE_NAME: terraguard_test
          JWT_SECRET_KEY: test-key-at-least-32-chars-long-for-testing-012345
          N8N_WEBHOOK_SECRET: tg_dev_secret_key

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix apps/web

      - name: Build Next.js Production Bundle
        run: |
          npm run build --prefix apps/web
        env:
          NEXT_PUBLIC_API_URL: https://terraguard-api.onrender.com/api/v1
          NEXT_PUBLIC_API_BASE_URL: https://terraguard-api.onrender.com/api/v1
          NEXT_PUBLIC_MAP_TILE_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
          NEXT_PUBLIC_DEFAULT_LAT: "12.9716"
          NEXT_PUBLIC_DEFAULT_LNG: "77.5946"

