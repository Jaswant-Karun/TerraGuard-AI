version: "3.8"

services:
  n8n-postgres:
    image: postgres:15-alpine
    container_name: terraguard-n8n-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_POSTGRESDB_USER:-terraguard_user}
      - POSTGRES_PASSWORD=${DB_POSTGRESDB_PASSWORD:-terraguard_secure_db_pass}
      - POSTGRES_DB=${DB_POSTGRESDB_DATABASE:-terraguard_n8n}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terraguard_user -d terraguard_n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - terraguard-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: terraguard-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-terraguard_n8n}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER:-terraguard_user}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:-terraguard_secure_db_pass}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
      - ../automation/n8n/workflows:/data/workflows:ro
    depends_on:
      n8n-postgres:
        condition: service_healthy
    networks:
      - terraguard-network

volumes:
  n8n_data:
    name: terraguard_n8n_data
  n8n_postgres_data:
    name: terraguard_n8n_postgres_data

networks:
  terraguard-network:
    name: terraguard-network
    driver: bridge

